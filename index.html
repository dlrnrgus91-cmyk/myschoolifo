<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 학교 시간표 & 급식 안내</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 10px 0;
      color: var(--primary-color);
    }

    .date-picker-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="date"] {
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      font-size: 1.25rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 8px 0;
      border-bottom: 1px solid #edf2f7;
    }

    li:last-child {
      border-bottom: none;
    }

    .period {
      font-weight: bold;
      color: var(--primary-color);
      margin-right: 8px;
    }

    .loading {
      color: #6b7280;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="school-title">학교 정보 조회</h1>
    <div class="date-picker-container">
      <label for="search-date">날짜 선택: </label>
      <input type="date" id="search-date">
    </div>
  </header>

  <div class="grid">
    <!-- 시간표 카드 -->
    <div class="card">
      <h2>📅 오늘의 시간표</h2>
      <ul id="timetable-list">
        <li class="loading">날짜를 선택하거나 데이터를 불러오는 중입니다...</li>
      </ul>
    </div>

    <!-- 급식 식단 카드 -->
    <div class="card">
      <h2>🍱 오늘의 급식</h2>
      <ul id="meal-list">
        <li class="loading">날짜를 선택하거나 데이터를 불러오는 중입니다...</li>
      </ul>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // [설정] 본인의 나이스 API 정보로 수정하세요.
  // ==========================================
  const CONFIG = {
    KEY: 'YOUR_NEIS_API_KEY',              // 발급받은 API 키
    ATPT_CODE: 'N10',                      // 시도교육청코드 (예: 충남 N10, 서울 B10)
    SD_CODE: '7000000',                    // 표준학교코드 (7자리)
    SCHUL_KND: 'mis'                       // 중학교: mis, 고등학교: his, 초등학교: els
  };

  // 오늘 날짜 기본 세팅 (YYYY-MM-DD)
  const dateInput = document.getElementById('search-date');
  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;

  // 페이지 로드시 데이터 조회
  fetchData(today);

  // 날짜 변경 시 다시 조회
  dateInput.addEventListener('change', (e) => {
    fetchData(e.target.value);
  });

  function fetchData(dateString) {
    const ymd = dateString.replace(/-/g, ''); // YYYYMMDD 형식 변환
    fetchTimetable(ymd);
    fetchMeal(ymd);
  }

  // 1. 시간표 조회 함수
  async function fetchTimetable(ymd) {
    const listEl = document.getElementById('timetable-list');
    listEl.innerHTML = '<li class="loading">시간표를 불러오는 중...</li>';

    // 중학교(misTimetable), 고등학교(hisTimetable), 초등학교(elsTimetable)
    const url = `https://open.neis.go.kr/hub/${CONFIG.SCHUL_KND}Timetable?KEY=${CONFIG.KEY}&Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=${CONFIG.ATPT_CODE}&SD_SCHUL_CODE=${CONFIG.SD_CODE}&ALL_TI_YMD=${ymd}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      
      const apiKey = `${CONFIG.SCHUL_KND}Timetable`;
      if (data[apiKey]) {
        const rows = data[apiKey][1].row;
        listEl.innerHTML = '';
        
        // 학년/반 정보가 필요할 경우 rows 필터링 가능 (예: 1학년 1반만 보기)
        rows.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="period">${item.PERIO}교시</span> ${item.ITRT_CNTNT}`;
          listEl.appendChild(li);
        });
      } else {
        listEl.innerHTML = '<li>등록된 시간표 정보가 없습니다.</li>';
      }
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li>시간표를 불러오는 중 오류가 발생했습니다.</li>';
    }
  }

  // 2. 급식 식단 조회 함수
  async function fetchMeal(ymd) {
    const listEl = document.getElementById('meal-list');
    listEl.innerHTML = '<li class="loading">급식 정보를 불러오는 중...</li>';

    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${CONFIG.KEY}&Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=${CONFIG.ATPT_CODE}&SD_SCHUL_CODE=${CONFIG.SD_CODE}&MLSV_YMD=${ymd}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (data.mealServiceDietInfo) {
        const rows = data.mealServiceDietInfo[1].row;
        listEl.innerHTML = '';
        
        rows.forEach(item => {
          // NEIS 급식 문자열 정제 (<br/> 태그 및 알레르기 숫자 제거)
          const cleanDDISH = item.DDISH_NM
            .replace(/<br\/>/g, '\n')
            .replace(/\([0-9.]+\)/g, '') // (1.2.3) 같은 알레르기 번호 제거
            .trim();

          const li = document.createElement('li');
          li.style.whiteSpace = 'pre-line'; // 줄바꿈 적용
          li.innerHTML = `<strong>[${item.MMEAL_SC_NM}]</strong>\n${cleanDDISH}`;
          listEl.appendChild(li);
        });
      } else {
        listEl.innerHTML = '<li>등록된 급식 정보가 없습니다.</li>';
      }
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li>급식 정보를 불러오는 중 오류가 발생했습니다.</li>';
    }
  }
</script>

</body>
</html>
