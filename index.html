<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 학교 시간표 & 급식 조회</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px 0;
      color: var(--primary);
    }

    p.subtitle {
      margin: 0;
      color: var(--subtext);
      font-size: 0.95rem;
    }

    .search-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    input, select, button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .school-list {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }

    .school-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
    }

    .school-item:hover {
      background-color: #f1f5f9;
    }

    .school-item:last-child { border-bottom: none; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .card h2 {
      margin-top: 0;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      font-size: 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }

    li:last-child { border-bottom: none; }

    .period {
      font-weight: bold;
      color: var(--primary);
      margin-right: 8px;
    }

    .badge {
      background: #e0e7ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .info-msg {
      color: var(--subtext);
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏫 학교 시간표 & 급식 조회</h1>
    <p class="subtitle">학교명과 날짜를 입력하여 정보를 확인하세요.</p>
  </header>

  <!-- 검색 및 설정 영역 -->
  <div class="search-card">
    <div class="form-group">
      <input type="text" id="school-search" placeholder="학교 이름을 입력하세요 (예: 서천여자중학교)" onkeyup="if(window.event.keyCode==13){searchSchool()}" />
      <button onclick="searchSchool()">학교 검색</button>
    </div>
    
    <!-- 학교 검색 결과 리스트 -->
    <div id="school-list" class="school-list"></div>

    <div class="form-group" style="margin-top: 12px;">
      <label style="align-self: center; font-weight: 600;">설정:</label>
      <input type="date" id="search-date">
      <select id="grade-select">
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>
      <select id="class-select">
        <option value="1">1반</option>
        <option value="2">2반</option>
        <option value="3">3반</option>
        <option value="4">4반</option>
        <option value="5">5반</option>
      </select>
      <button onclick="loadAllData()" style="flex: 1;">조회하기</button>
    </div>
  </div>

  <!-- 결과 출력 영역 -->
  <div class="grid">
    <!-- 시간표 -->
    <div class="card">
      <h2>📅 시간표 <span id="selected-info" class="badge">학교 미선택</span></h2>
      <ul id="timetable-list">
        <li class="info-msg">상단에서 학교를 검색하고 선택해주세요.</li>
      </ul>
    </div>

    <!-- 급식 -->
    <div class="card">
      <h2>🍱 오늘의 급식</h2>
      <ul id="meal-list">
        <li class="info-msg">상단에서 학교를 검색하고 선택해주세요.</li>
      </ul>
    </div>
  </div>
</div>

<script>
  // 나이스 API KEY 적용
  const API_KEY = 'ace06cbd4173459280380a35386e3f17'; 

  let currentSchool = null;

  // 오늘 날짜 세팅
  const dateInput = document.getElementById('search-date');
  dateInput.value = new Date().toISOString().split('T')[0];

  // 1. 학교 이름으로 NEIS API 검색
  async function searchSchool() {
    const query = document.getElementById('school-search').value.trim();
    const listEl = document.getElementById('school-list');

    if (!query) {
      alert('학교 이름을 입력해 주세요.');
      return;
    }

    listEl.style.display = 'block';
    listEl.innerHTML = '<div class="school-item">검색 중...</div>';

    const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${API_KEY}&Type=json&pIndex=1&pSize=10&SCHUL_NM=${encodeURIComponent(query)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (data.schoolInfo) {
        const schools = data.schoolInfo[1].row;
        listEl.innerHTML = '';
        
        schools.forEach(sch => {
          const item = document.createElement('div');
          item.className = 'school-item';
          item.innerHTML = `<strong>${sch.SCHUL_NM}</strong> (${sch.LCTN_SC_NM}) - ${sch.ORG_RDNMA || ''}`;
          item.onclick = () => selectSchool(sch);
          listEl.appendChild(item);
        });
      } else {
        listEl.innerHTML = '<div class="school-item">검색 결과가 없습니다.</div>';
      }
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<div class="school-item">학교 검색 중 오류가 발생했습니다.</div>';
    }
  }

  // 2. 학교 목록에서 특정 학교 선택
  function selectSchool(sch) {
    currentSchool = {
      atptCode: sch.ATPT_OFCDC_SC_CODE,
      sdCode: sch.SD_SCHUL_CODE,
      name: sch.SCHUL_NM,
      kind: sch.SCHUL_KND_SC_NM
    };

    document.getElementById('school-search').value = sch.SCHUL_NM;
    document.getElementById('school-list').style.display = 'none';
    
    loadAllData();
  }

  // 3. 시간표 & 급식 데이터 동시 조회
  function loadAllData() {
    if (!currentSchool) {
      alert('먼저 학교 검색 후 학교를 선택해 주세요.');
      return;
    }

    const ymd = dateInput.value.replace(/-/g, '');
    const grade = document.getElementById('grade-select').value;
    const classNum = document.getElementById('class-select').value;

    document.getElementById('selected-info').innerText = `${currentSchool.name} ${grade}-${classNum}`;

    fetchTimetable(ymd, grade, classNum);
    fetchMeal(ymd);
  }

  // 4. 시간표 API 호출
  async function fetchTimetable(ymd, grade, classNum) {
    const listEl = document.getElementById('timetable-list');
    listEl.innerHTML = '<li class="info-msg">시간표 불러오는 중...</li>';

    let timetableType = 'misTimetable';
    if (currentSchool.kind.includes('초등')) timetableType = 'elsTimetable';
    else if (currentSchool.kind.includes('고등')) timetableType = 'hisTimetable';

    const url = `https://open.neis.go.kr/hub/${timetableType}?KEY=${API_KEY}&Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=${currentSchool.atptCode}&SD_SCHUL_CODE=${currentSchool.sdCode}&ALL_TI_YMD=${ymd}&GRADE=${grade}&CLASS_NM=${classNum}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (data[timetableType]) {
        const rows = data[timetableType][1].row;
        listEl.innerHTML = '';
        
        rows.sort((a, b) => a.PERIO - b.PERIO).forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="period">${item.PERIO}교시</span> ${item.ITRT_CNTNT}`;
          listEl.appendChild(li);
        });
      } else {
        listEl.innerHTML = '<li class="info-msg">해당 날짜/학급의 시간표 정보가 없습니다.</li>';
      }
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li class="info-msg">시간표 조회 중 오류가 발생했습니다.</li>';
    }
  }

  // 5. 급식 API 호출
  async function fetchMeal(ymd) {
    const listEl = document.getElementById('meal-list');
    listEl.innerHTML = '<li class="info-msg">급식 정보를 불러오는 중...</li>';

    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=${currentSchool.atptCode}&SD_SCHUL_CODE=${currentSchool.sdCode}&MLSV_YMD=${ymd}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (data.mealServiceDietInfo) {
        const rows = data.mealServiceDietInfo[1].row;
        listEl.innerHTML = '';

        rows.forEach(item => {
          const cleanDDISH = item.DDISH_NM
            .replace(/<br\/>/g, '\n')
            .replace(/\([0-9.]+\)/g, '')
            .trim();

          const li = document.createElement('li');
          li.style.whiteSpace = 'pre-line';
          li.innerHTML = `<strong style="color:var(--primary)">[${item.MMEAL_SC_NM}]</strong>\n${cleanDDISH}`;
          listEl.appendChild(li);
        });
      } else {
        listEl.innerHTML = '<li class="info-msg">해당 날짜에 등록된 급식이 없습니다.</li>';
      }
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li class="info-msg">급식 조회 중 오류가 발생했습니다.</li>';
    }
  }
</script>

</body>
</html>
